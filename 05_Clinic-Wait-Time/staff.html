<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal - Clinic Queue Management</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }

    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 15px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .login-title {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
    }

    .dashboard {
      display: none;
      padding: 20px;
    }

    .header {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .header-title {
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }

    .clinic-status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 500;
    }

    .status-open {
      color: #28a745;
    }

    .status-closed {
      color: #dc3545;
    }

    .logout-btn {
      padding: 8px 16px;
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }

    .logout-btn:hover {
      background: #c82333;
    }

    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #333;
    }

    .form-group input, .form-group button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 2px solid #ddd;
      font-size: 14px;
    }

    .form-group button {
      background: #667eea;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.3s;
    }

    .form-group button:hover {
      background: #5568d3;
    }

    .queue-container {
      grid-column: 1 / -1;
    }

    .queue-list {
      max-height: 400px;
      overflow-y: auto;
    }

    .queue-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #f8f9fa;
      margin-bottom: 10px;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }

    .queue-item.urgent {
      border-left-color: #dc3545;
      background: #fff5f5;
    }

    .queue-info {
      flex: 1;
    }

    .queue-name {
      font-weight: bold;
      color: #333;
      font-size: 15px;
    }

    .queue-details {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    .queue-actions {
      display: flex;
      gap: 8px;
    }

    .btn-small {
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }

    .btn-urgent {
      background: #ffc107;
      color: #333;
    }

    .btn-remove {
      background: #dc3545;
      color: white;
    }

    .btn-urgent:hover {
      background: #e0a800;
    }

    .btn-remove:hover {
      background: #c82333;
    }

    .audit-log {
      grid-column: 1 / -1;
      max-height: 250px;
      overflow-y: auto;
      font-size: 12px;
    }

    .log-entry {
      padding: 8px;
      background: #f8f9fa;
      margin-bottom: 8px;
      border-radius: 5px;
      border-left: 3px solid #667eea;
    }

    .log-time {
      color: #999;
      font-size: 11px;
    }

    .log-action {
      color: #333;
      font-weight: 500;
    }

    .info-box {
      background: #e7f3ff;
      color: #0066cc;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 15px;
    }

    @media (max-width: 1024px) {
      .main-content {
        grid-template-columns: 1fr;
      }

      .queue-container {
        grid-column: 1;
      }

      .audit-log {
        grid-column: 1;
      }
    }

    .success-message {
      background: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div class="login-container" id="loginContainer">
    <div class="login-box">
      <div class="login-title">👨‍⚕️ Staff Portal</div>
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" required placeholder="staff1 or staff2">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="demo123">
        </div>
        <button type="submit" class="login-btn">Login</button>
        <div class="error-message" id="loginError"></div>
      </form>
      <div class="info-box" style="margin-top: 20px;">
        Demo credentials:<br>
        Username: <strong>staff1</strong><br>
        Password: <strong>demo123</strong>
      </div>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="header">
      <div>
        <div class="header-title">🏥 Clinic Queue Management</div>
      </div>
      <div style="display: flex; gap: 20px; align-items: center;">
        <div class="clinic-status" id="clinicStatus">
          <span class="status-open">🟢 Clinic Open</span>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="main-content">
      <!-- Add Patient -->
      <div class="card">
        <div class="card-title">➕ Add Patient</div>
        <div class="success-message" id="successMessage">Patient added successfully!</div>
        <form id="addPatientForm">
          <div class="form-group">
            <input type="text" id="patientName" placeholder="Patient Name" required>
          </div>
          <div class="form-group">
            <input type="text" id="patientReg" placeholder="Registration Number" required>
          </div>
          <div class="form-group">
            <button type="submit">Add to Queue</button>
          </div>
        </form>
      </div>

      <!-- Queue Stats -->
      <div class="card">
        <div class="card-title">📊 Queue Status</div>
        <div class="info-box">
          <div style="font-size: 24px; font-weight: bold; color: #667eea; margin: 10px 0;">
            <span id="queueCount">0</span> patients waiting
          </div>
          <div style="font-size: 14px; color: #666;">
            Avg wait: <span id="avgWait">0</span> min
          </div>
        </div>
      </div>

      <!-- Queue List -->
      <div class="card queue-container">
        <div class="card-title">👥 Current Queue</div>
        <div class="queue-list" id="queueList">
          <div style="color: #999; padding: 20px; text-align: center;">No patients in queue</div>
        </div>
      </div>

      <!-- Audit Log -->
      <div class="card audit-log">
        <div class="card-title">📝 Recent Actions</div>
        <div id="auditLog">
          <div style="color: #999; font-size: 12px;">No actions yet</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let token = null;
    let currentUsername = null;

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();
        if (data.success) {
          token = data.token;
          currentUsername = username;
          document.getElementById('loginContainer').style.display = 'none';
          document.getElementById('dashboard').style.display = 'block';
          loadQueue();
          loadAuditLog();
          setInterval(loadQueue, 10000);
          setInterval(loadAuditLog, 15000);
        } else {
          document.getElementById('loginError').textContent = 'Invalid credentials';
        }
      } catch (error) {
        document.getElementById('loginError').textContent = 'Login failed';
      }
    });

    // Add patient
    document.getElementById('addPatientForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('patientName').value;
      const registration = document.getElementById('patientReg').value;

      try {
        const response = await fetch('/api/queue/add', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ name, registration_number: registration })
        });

        if (response.ok) {
          document.getElementById('patientName').value = '';
          document.getElementById('patientReg').value = '';

          const successMsg = document.getElementById('successMessage');
          successMsg.style.display = 'block';
          setTimeout(() => { successMsg.style.display = 'none'; }, 3000);

          loadQueue();
          loadAuditLog();
        }
      } catch (error) {
        alert('Failed to add patient');
      }
    });

    async function loadQueue() {
      try {
        const response = await fetch('/api/staff/queue', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await response.json();
        document.getElementById('queueCount').textContent = data.total_patients;
        document.getElementById('avgWait').textContent = data.avg_consultation_duration;

        const clinicStatus = document.getElementById('clinicStatus');
        if (data.clinic_open) {
          clinicStatus.innerHTML = '<span class="status-open">🟢 Clinic Open</span>';
        } else {
          clinicStatus.innerHTML = '<span class="status-closed">🔴 Clinic Closed</span>';
        }

        if (data.queue.length === 0) {
          document.getElementById('queueList').innerHTML =
            '<div style="color: #999; padding: 20px; text-align: center;">No patients in queue</div>';
          return;
        }

        let html = '';
        data.queue.forEach(patient => {
          const isUrgent = patient.priority === 'urgent';
          html += `
            <div class="queue-item ${isUrgent ? 'urgent' : ''}">
              <div class="queue-info">
                <div class="queue-name">${patient.name} ${isUrgent ? '🚨' : ''}</div>
                <div class="queue-details">
                  Reg: ${patient.registration} | Wait: ${patient.estimated_wait}m | Pos: ${patient.position}
                </div>
              </div>
              <div class="queue-actions">
                ${!isUrgent ? `<button class="btn-small btn-urgent" onclick="markUrgent(${patient.id})">Urgent</button>` : ''}
                <button class="btn-small btn-remove" onclick="removePatient(${patient.id})">Remove</button>
              </div>
            </div>
          `;
        });
        document.getElementById('queueList').innerHTML = html;
      } catch (error) {
        console.error('Failed to load queue:', error);
      }
    }

    async function loadAuditLog() {
      try {
        const response = await fetch('/api/staff/audit-log', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await response.json();
        if (data.logs.length === 0) {
          document.getElementById('auditLog').innerHTML =
            '<div style="color: #999; font-size: 12px;">No actions yet</div>';
          return;
        }

        let html = '';
        data.logs.forEach(log => {
          const time = new Date(log.timestamp).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
          const actionText = {
            'add': '➕ Added',
            'remove': '❌ Removed',
            'mark_urgent': '🚨 Marked urgent'
          }[log.action] || log.action;

          html += `
            <div class="log-entry">
              <div class="log-time">${time}</div>
              <div class="log-action">${actionText} - ${log.details.name || 'Unknown'}</div>
            </div>
          `;
        });
        document.getElementById('auditLog').innerHTML = html;
      } catch (error) {
        console.error('Failed to load audit log:', error);
      }
    }

    async function removePatient(patientId) {
      if (!confirm('Remove this patient from the queue?')) return;

      try {
        const response = await fetch(`/api/queue/${patientId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
          loadQueue();
          loadAuditLog();
        }
      } catch (error) {
        alert('Failed to remove patient');
      }
    }

    async function markUrgent(patientId) {
      if (!confirm('Mark this patient as urgent? They will move to the front of the queue.')) return;

      try {
        const response = await fetch(`/api/queue/${patientId}`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
          loadQueue();
          loadAuditLog();
        }
      } catch (error) {
        alert('Failed to mark as urgent');
      }
    }

    function logout() {
      token = null;
      currentUsername = null;
      document.getElementById('loginContainer').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('loginForm').reset();
      document.getElementById('loginError').textContent = '';
    }
  </script>
</body>
</html>
